{% capture img_url %}
{% include images/image-path.html image-path=include.image-path %}
{% endcapture %}

{% assign img_url = img_url | strip %}

{% unless img_url %}
  <div class="figure-placeholder">
    image-path missing &mdash; check the image-path parameter in this figure include
  </div>
{% endunless %}

<figure class="{{ include.class }} figure-sized" style="--figure-width: {{ include.width | default: '40%' }};">

  <a class="image" href="{{ img_url }}"><img src="{{ img_url }}" alt="{{ include.alt-text | default: include.caption }}"></a>

  <figcaption>
    {{ include.caption | markdownify }}
  </figcaption>

</figure>
